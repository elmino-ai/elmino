  '@anthropic-ai/sdk': 0.115.0
  openai: 7.4.0
  zod: 4.4.3
  vitest: 4.1.10
  type-fest: 5.8.0
  dayjs: 1.11.21
  drizzle-orm: 1.0.0-rc.4
  '@lydell/node-pty': 1.2.0-beta.12
  '@vscode/ripgrep': 1.18.0
  cross-spawn: 7.0.6
  '@types/cross-spawn': 6.0.6
  shell-quote: 1.10.0
  trash: 10.1.1
  p-queue: 9.3.3
  yaml: 2.9.0
